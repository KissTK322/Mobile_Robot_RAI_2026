scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: range
      type: laser_filters/LaserScanRangeFilter
      params:
        use_message_range_limits: false
        lower_threshold: 0.25
        upper_threshold: .inf
        lower_replacement_value: .nan
        upper_replacement_value: .inf
    filter2:
      name: post_rear_right
      type: laser_filters/LaserScanAngularBoundsFilterInPlace
      params:
        lower_angle: -2.4000
        upper_angle: -2.2600
    filter3:
      name: post_front_right
      type: laser_filters/LaserScanAngularBoundsFilterInPlace
      params:
        lower_angle: -0.8500
        upper_angle: -0.7000
    filter4:
      name: post_front_left
      type: laser_filters/LaserScanAngularBoundsFilterInPlace
      params:
        lower_angle: 0.7100
        upper_angle: 0.8500
    filter5:
      name: post_rear_left
      type: laser_filters/LaserScanAngularBoundsFilterInPlace
      params:
        lower_angle: 2.2900
        upper_angle: 2.4200
    filter6:
      name: extra_145deg
      type: laser_filters/LaserScanAngularBoundsFilterInPlace
      params:
        lower_angle: 2.5000
        upper_angle: 2.5550
