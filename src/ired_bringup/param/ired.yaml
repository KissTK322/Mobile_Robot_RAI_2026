forward_kinematics_node:
  ros__parameters:
    motor_data_topic: "/ired/motor/data"
    robot_speed_topic: "/ired/speed"
    wheel_seperation: 0.22
    rpm_to_mps: 0.00680678

inverse_kinematics_node:
  ros__parameters:
    cmd_vel_topic: "/cmd_vel"
    motor_control_topic: "/ired/motor/speed_control"
    wheel_seperation: 0.22
    mps_to_rpm: 146.912

imu_node:
  ros__parameters:
    imu_raw_topic: "/ired/imu/raw"
    imu_data_topic: "/ired/imu/data"
    rpy_topic: "/ired/imu/rollpitchyaw"
    gyro_z_scale: 1.187
    motor_data_topic: "/ired/motor/data"
    still_rpm: 1.0
    still_time: 0.5
    bias_alpha: 0.05

odom_node:
  ros__parameters:
    odom_topic: "/wheel_odom"
    joint_state_topic: "/joint_states"
    motor_data_topic: "/ired/motor/data"
    rpy_topic: "/ired/imu/rollpitchyaw"
    robot_speed_topic: "/ired/speed"
    odom_tf_publish: false
    rpm_to_mps: 0.00680678
    wheel_radius: 0.065

iredcr_modbus_node:
  ros__parameters:
    imu_raw_topic: "/ired/imu/raw"
    motor_control_topic: "/ired/motor/speed_control"
    motor_data_topic: "/ired/motor/data"
    port: "/dev/ttyMicro"
    baud: 115200
    # Wheel PID [kp, ki, kd], tuned 2026-10-16 with the wheels lifted (old: FL/RL 6.2 0.88 0.03, FR/RR 7.0 1.05 0.05)
    pid_fl: [6.0, 35.0, 0.05]
    pid_fr: [6.0, 35.0, 0.05]
    pid_rl: [6.0, 35.0, 0.05]
    pid_rr: [6.0, 35.0, 0.05]
