<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#16232e">
  <title>iRED Field View</title>
  <link rel="stylesheet" href="field.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <header class="topbar">
    <div class="brand">iRED</div>
    <div class="link" id="link">Demo data, not the robot</div>
    <button class="estop" id="estop">STOP</button>
  </header>

  <main class="stage">
    <div id="view" aria-label="Field view. Tap a zone to send the robot there."></div>

    <section class="hud" aria-live="polite">
      <div class="zone-now" id="zone-now">C_Z51</div>
      <div class="pose" id="pose">x 4.50 m, y 0.50 m, heading 180°</div>
      <div class="task" id="task">Idle. Tap a zone to send the robot.</div>
    </section>

    <div class="toolbar">
      <div class="segmented" role="radiogroup" aria-label="View">
        <button role="radio" aria-checked="true" data-view="2d">Top</button>
        <button role="radio" aria-checked="false" data-view="3d">3D</button>
      </div>
      <div class="layers" aria-label="Show">
        <button aria-pressed="true" data-layer="scan"><i class="sw scan"></i>LiDAR</button>
        <button aria-pressed="true" data-layer="path"><i class="sw path"></i>Path</button>
        <button aria-pressed="true" data-layer="boxes"><i class="sw box"></i>Stations</button>
        <button aria-pressed="true" data-layer="model"><i class="sw bot"></i>Robot</button>
      </div>
      <div class="segmented" role="radiogroup" aria-label="Tap does">
        <button role="radio" aria-checked="true" data-mode="goal">Tap: send</button>
        <button role="radio" aria-checked="false" data-mode="pose">Tap: set start</button>
      </div>
    </div>

    <div class="sheet" id="sheet" hidden>
      <p id="sheet-text">Send the robot to C_Z44?</p>
      <div class="sheet-actions">
        <button class="primary" id="sheet-ok">Send</button>
        <button id="sheet-cancel">Cancel</button>
      </div>
    </div>
  </main>

  <script type="module" src="field.js"></script>
</body>
</html>
