# iRED web app settings. With colcon --symlink-install, edits here apply on the
# next restart of the app (sudo systemctl restart ired-web), no rebuild needed.

# PIN asked by the app before it can control the robot. Change it to your own.
pin: "123456"

http_port: 8080        # the app:      http://robotg5.local:8080
rosbridge_port: 9090   # ROS <-> browser websocket
video_port: 8081       # camera MJPEG stream (web_video_server)
foxglove_port: 8765    # Foxglove Studio:  ws://robotg5.local:8765
log_dir: ~/.ros/ired_web
maps_dir: ~/ired_ws/src/ired_navigation/maps   # Map page saves maps here
refbox_address: 172.16.1.4   # MQTT broker of the refbox bridge (or refbox_lite on the PC); change on the day

# Startable groups of nodes. {name} fields are filled from the settings above.
# requires: started first if not running; conflicts: stopped first.
profiles:
  web:
    title: Web services
    description: rosbridge, camera stream and Foxglove bridge (always on)
    command: ros2 launch ired_web web.launch.py rosbridge_port:={rosbridge_port} video_port:={video_port} foxglove_port:={foxglove_port}
    autostart: true
    hidden: true
  robot:
    title: Robot
    description: Motors, IMU, LiDAR, odometry and EKF (ired_bringup)
    command: ros2 launch ired_bringup bringup.launch.py
  camera:
    title: Camera + ArUco
    description: Webcam with ArUco marker detection
    # marker_size_m: robot test 2026-10-28 (marker upright, tape from the lens): 50/100/150 cm read
    # 54.4/111.0/164.8 cm = 10.4 % too far with 0.07. 0.0634 = 0.07 / 1.104 (the black square is
    # probably ~6.3 cm; re-measure the black square only). Plan B: remove the parameter.
    command: python3 ~/ired_ws/src/ired_bringup/scripts/aruco_ros2_node.py --ros-args -p marker_size_m:=0.0634
  mapping:
    title: Mapping (SLAM)
    description: Cartographer, build a new map while driving
    command: ros2 launch ired_navigation slam.launch.xml
    requires: [robot]
    conflicts: [navigation, navigation_omni, navigation_softstop, mapping_odom, navigation_quick, navigation_fast, navigation_fast_soft]
  mapping_odom:
    title: Mapping (odom)
    description: Cartographer helped by wheel + gyro odometry, LiDAR rays cut at 6 m (test; Mapping (SLAM) is plan B)
    command: ros2 launch ired_navigation slam.launch.xml configuration_basename:=ired_rplidar_2d_odom.lua
    requires: [robot]
    conflicts: [navigation, navigation_omni, navigation_softstop, mapping, navigation_quick, navigation_fast, navigation_fast_soft]
  navigation:
    title: Navigation
    description: Nav2 with the saved map and AMCL
    # {map_name}: the map chosen on the Map page (maps_dir), default map
    command: ros2 launch ired_navigation navigation.launch.xml map_name:={map_name}.yaml
    requires: [robot]
    conflicts: [mapping, mapping_odom, navigation_omni, navigation_softstop, navigation_quick, navigation_fast, navigation_fast_soft]
  challenge_nav:
    title: "Challenge: Navigation"
    description: Refbox bridge + MPS boxes + navigation challenge program (start a Navigation profile and set the start pose first)
    # REFBOX_BRIDGE_ADDRESS = the MQTT broker (refbox bridge, or refbox_lite on the PC); ROBOT_IP = this robot
    command: bash -c 'export REFBOX_BRIDGE_ADDRESS={game_refbox_address} ROBOT_IP={game_robot_topic}; ros2 run ired_refbox mqtt_refbox & exec ros2 launch ired_challenge navigation_challenge.launch.py practice_watchdog:={practice_watchdog}'
    requires: [robot]
    conflicts: [challenge_exp, challenge_exp_lidar]
  challenge_exp:
    title: "Challenge: Exploration"
    description: Refbox bridge + exploration challenge program (finds C-BS and C-CS1 with the camera and reports them; start Camera + ArUco and a Navigation profile first)
    command: bash -c 'export REFBOX_BRIDGE_ADDRESS={game_refbox_address} ROBOT_IP={game_robot_topic}; ros2 run ired_refbox mqtt_refbox & exec ros2 run ired_challenge exploration_challenge --ros-args -p practice_watchdog:={practice_watchdog}'
    requires: [robot]
    conflicts: [challenge_nav, challenge_exp_lidar]
  challenge_exp_lidar:
    title: "Challenge: Exploration (LiDAR)"
    description: Like Challenge Exploration, but first looks where the LiDAR sees boxes (stacked ~40 cm boxes only), then sweeps the rest
    command: bash -c 'export REFBOX_BRIDGE_ADDRESS={game_refbox_address} ROBOT_IP={game_robot_topic}; ros2 run ired_refbox mqtt_refbox & exec ros2 run ired_challenge exploration_challenge --ros-args -p practice_watchdog:={practice_watchdog} -p search_mode:=lidar'
    requires: [robot]
    conflicts: [challenge_nav, challenge_exp]
  record:
    title: Record (rosbag)
    description: Records driving data to ~/bags while Navigation runs (for finding why the robot stalls)
    # small topics only (no images, no particle cloud, local costmap at 2 Hz): about 0.2-0.5 MB/s
    command: bash -c 'mkdir -p $HOME/bags && exec ros2 bag record -o $HOME/bags/nav-$(date +%Y%m%d-%H%M%S) /cmd_vel /cmd_vel_nav /cmd_vel_smoothed /collision_monitor_state /odometry/filtered /odom /ired/motor/data /scan_filtered /amcl_pose /goal_pose /initialpose /plan /local_plan /local_costmap/costmap /behavior_tree_log /tf /tf_static'
    requires: [robot]
  navigation_omni:
    title: Navigation (omni)
    description: Nav2 tuned for the omni base (sideways, soft start/stop, real robot size)
    command: ros2 launch ired_navigation navigation.launch.xml map_name:={map_name}.yaml param_name:=navigation_omni.yaml
    requires: [robot]
    conflicts: [mapping, mapping_odom, navigation, navigation_softstop, navigation_quick, navigation_fast, navigation_fast_soft]
  navigation_softstop:
    title: Navigation (soft-stop)
    description: Navigation (omni) with gentle 0.18 m/s^2 starts/stops and wall slowdown only when moving toward it (test)
    command: ros2 launch ired_navigation navigation.launch.xml map_name:={map_name}.yaml param_name:=navigation_softstop.yaml
    requires: [robot]
    conflicts: [mapping, mapping_odom, navigation, navigation_omni, navigation_quick, navigation_fast, navigation_fast_soft]

  navigation_quick:
    title: Navigation (quick start)
    description: Like Navigation (soft-stop) but accelerates at 0.30 m/s^2 (braking stays 0.18) - test
    command: ros2 launch ired_navigation navigation.launch.xml map_name:={map_name}.yaml param_name:=navigation_softstop_quick.yaml
    requires: [robot]
    conflicts: [mapping, mapping_odom, navigation, navigation_omni, navigation_softstop, navigation_fast, navigation_fast_soft]
  navigation_fast:
    title: Navigation (fast 0.30)
    description: 0.30 m/s, accel 0.30, braking 0.25 m/s^2 - PC sim 2026-10-28 12/12 in 140 s (quick start 154 s), same accuracy - test
    command: ros2 launch ired_navigation navigation.launch.xml map_name:={map_name}.yaml param_name:=navigation_fast_30d.yaml
    requires: [robot]
    conflicts: [mapping, mapping_odom, navigation, navigation_omni, navigation_softstop, navigation_quick, navigation_fast_soft]
  navigation_fast_soft:
    title: Navigation (fast 0.30, soft brake)
    description: 0.30 m/s, accel 0.30, braking 0.18 m/s^2 - PC sim 2026-10-28 12/12 in 148 s - test
    command: ros2 launch ired_navigation navigation.launch.xml map_name:={map_name}.yaml param_name:=navigation_fast_30.yaml
    requires: [robot]
    conflicts: [mapping, mapping_odom, navigation, navigation_omni, navigation_softstop, navigation_quick, navigation_fast]

  practice_broker:
    title: Practice MQTT broker
    description: Loopback-only broker for phone-controlled practice games
    command: mosquitto -c {practice_broker_config}
    hidden: true
