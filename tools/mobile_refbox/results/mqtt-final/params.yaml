amcl:
  ros__parameters:
    alpha1: 0.1
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.1
    always_reset_initial_pose: false
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    first_map_only: false
    global_frame_id: map
    initial_pose:
      x: 4.5
      y: 0.5
      yaw: -3.1415926535
      z: 0.0
    lambda_short: 0.1
    laser_likelihood_max_dist: 1.0
    laser_max_range: 6.0
    laser_min_range: -0.1
    laser_model_type: likelihood_field
    map_topic: map
    max_beams: 90
    max_particles: 1000
    min_particles: 200
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::OmniMotionModel
    save_pose_rate: 2.0
    scan_topic: scan_filtered
    set_initial_pose: true
    sigma_hit: 0.07
    tf_broadcast: true
    transform_tolerance: 0.5
    update_min_a: 0.1
    update_min_d: 0.05
    z_hit: 0.85
    z_max: 0.05
    z_rand: 0.15
    z_short: 0.05
behavior_server:
  ros__parameters:
    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop
    backup:
      plugin: nav2_behaviors::BackUp
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    - assisted_teleop
    cycle_frequency: 10.0
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    enable_stamped_cmd_vel: true
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    global_frame: map
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    local_frame: odom
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    robot_base_frame: base_link
    rotational_acc_lim: 2.0
    simulate_ahead_time: 2.0
    spin:
      plugin: nav2_behaviors::Spin
    transform_timeout: 0.1
    wait:
      plugin: nav2_behaviors::Wait
bt_navigator:
  ros__parameters:
    always_reload_bt_xml: false
    default_nav_through_poses_bt_xml: /opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    default_nav_to_pose_bt_xml: /opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    error_code_name_prefixes:
    - assisted_teleop
    - backup
    - compute_path
    - dock_robot
    - drive_on_heading
    - follow_path
    - nav_thru_poses
    - nav_to_pose
    - spin
    - route
    - undock_robot
    - wait
    filter_duration: 0.3
    global_frame: map
    goal_blackboard_id: goal
    goals_blackboard_id: goals
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    path_blackboard_id: path
    robot_base_frame: base_link
    transform_tolerance: 0.5
